# Copiado de skills/research-download-chain/gha-move-files.yml.
name: Move files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/move-wordflow-code-to-nct-main.yml']
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  group: research-download-chain-final
  cancel-in-progress: false
jobs:
  move-other-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: maxbry123-commits/agentes
          ref: main
          fetch-depth: 1
          lfs: false
          path: src
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true
          path: dest
      - name: copiar raiz completa a main
        shell: bash
        run: |
          set -euo pipefail
          test -d 'src/Wordflow Code'
          if [ ! -e 'dest/Wordflow Code' ]; then
            mkdir -p 'dest/Wordflow Code'
          fi
          cp -an 'src/Wordflow Code/.' 'dest/Wordflow Code/'
      - name: verificar copia exacta y guardar
        working-directory: dest
        shell: bash
        run: |
          set -euo pipefail
          diff -qr '../src/Wordflow Code' 'Wordflow Code'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'Wordflow Code'
          git diff --cached --quiet && echo 'PASS NOOP: raiz ya copiada' && exit 0
          git commit -m 'move: Wordflow Code from agentes to nct-core main'
          git pull --rebase origin main
          git push --no-verify origin HEAD:main
