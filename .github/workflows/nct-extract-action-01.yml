name: NCT Extract Action 01
run-name: NCT Extract Action 01 • ${{ github.sha }}

on:
  push:
    paths:
      - '.github/workflows/nct-extract-action-01.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  group: nct-extract-action-01-componentes-open-source
  cancel-in-progress: false

jobs:
  extract-5-components:
    name: Extract 5 components sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Extract Action 01 queue
        shell: bash
        run: |
          set -euo pipefail
          ROOT='Componentes open soure nct'
          for COMPONENT in 'Aider' 'BESSER' 'Bit' 'BuilderIO' 'Cline'; do
            mapfile -t PARTS < <(find "$ROOT" -maxdepth 1 -type f -name "${COMPONENT}_*.zip" -print | sort -V)
            test "${#PARTS[@]}" -gt 0
            for PART in "${PARTS[@]}"; do
              unzip -oq "$PART" -d "$ROOT"
            done
          done

      - name: Publish extracted trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Componentes open soure nct/Aider' 'Componentes open soure nct/BESSER' 'Componentes open soure nct/Bit' 'Componentes open soure nct/BuilderIO' 'Componentes open soure nct/Cline'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build(nct): extract action 01 components'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
