name: NCT Extract Repair 04
run-name: NCT Extract Repair 04 • ${{ github.sha }}

on:
  push:
    paths:
      - '.github/workflows/nct-extract-repair-04.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  group: nct-core-cline-repair-04-locked-skill
  cancel-in-progress: false

jobs:
  extract-cline:
    name: EXTRACT_ONLY Cline with locked canonical skill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout destination main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Validate locked skill source
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/skill-lock/extract_existing_parts.py
          test "$(git hash-object scripts/skill-lock/extract_existing_parts.py)" = '082e6f63980aff5e457837a3030af37892a7e069'
          python3 -m py_compile scripts/skill-lock/extract_existing_parts.py

      - name: Extract existing Cline ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false
          git config --local core.compression 0
          python3 scripts/skill-lock/extract_existing_parts.py \
            'Componentes open soure nct' \
            'Cline' \
            'https://github.com/cline/cline.git' \
            '48d63852745460ff0fa3dfcc0457bbe2493841de' \
            'Apache-2.0' \
            '3'

      - name: Publish only from fresh snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'PUBLISH_SNAPSHOT_STALE_GAP'; exit 42; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'Componentes open soure nct/Cline'
          git diff --cached --quiet && { echo 'NO_CHANGE_GAP'; exit 32; }
          git commit -m 'build(nct): extract Cline repair 04'
          git push --no-verify origin HEAD:main

      - name: Read-back final Cline tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -d 'Componentes open soure nct/Cline'
          grep -Fx 'https://github.com/cline/cline.git' 'Componentes open soure nct/Cline/SOURCE_URL.txt'
          grep -Fx '48d63852745460ff0fa3dfcc0457bbe2493841de' 'Componentes open soure nct/Cline/SOURCE_COMMIT.txt'
          grep -Fx 'Apache-2.0' 'Componentes open soure nct/Cline/SOURCE_LICENSE.txt'
          (cd 'Componentes open soure nct/Cline' && sha256sum -c SOURCE_SHA256SUMS.txt)
          echo 'READ_BACK PASS Cline EXTRACTED_TREE'
