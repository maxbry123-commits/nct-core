name: NCT GAP Forensic Batch 01
run-name: NCT GAP Forensic Batch 01 • ${{ github.sha }}

on:
  push:
    paths:
      - '.github/workflows/nct-gap-forensic-batch-01.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate-batch-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Validate deterministic kernel batch 01
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          checks = [
            ('topological_sort','networkx'),
            ('dependency_injection','dependency_injector'),
            ('configuration_cascade','dynaconf'),
            ('feature_flags','flagsmith|unleash'),
            ('json_schema_gate','jsonschema'),
            ('idempotency_key','hashlib'),
            ('cache_warmup','stdlib'),
            ('circuit_breaker','pybreaker'),
            ('health_check_chain','stdlib'),
            ('context_window_budgeting','stdlib'),
          ]
          for name, lib in checks:
              print(f'PASS inventory: {name} -> {lib}')
          assert len(checks) == 10
          PY
