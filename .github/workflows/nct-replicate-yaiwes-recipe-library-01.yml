name: NCT replicate YAIWES Recipe Library 01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nct-replicate-yaiwes-recipe-library-01.yml"

permissions:
  contents: write

concurrency:
  group: nct-core-wordflow-code-recipe-library-01
  cancel-in-progress: false

env:
  SOURCE_REPO: maxbry123-commits/agentes
  SOURCE_COMMIT: 0efb147c54059c2ae1a907b98f7b046ccd2be706
  SOURCE_PATH: agente-yaiwes/multi-workflow-engine/instances/github-recipe-library-workflow
  DEST_PATH: Wordflow code/github-recipe-library-workflow

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout nct-core main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout verified agentes source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_COMMIT }}
          path: _source
          fetch-depth: 1

      - name: Preflight copy and validate
        shell: bash
        run: |
          set -euo pipefail
          src="_source/$SOURCE_PATH"
          dst="$DEST_PATH"
          test -d "$src"
          test -f "$src/manifests/SOURCE_MANIFEST.jsonl"
          source_hash="$(find "$src" -type f -print0 | sed -z "s#^$src/##" | sort -z | while IFS= read -r -d '' f; do sha256sum "$src/$f" | sed "s#  $src/#  #"; done | sha256sum | awk '{print $1}')"
          if test -e "$dst"; then
            dest_hash="$(find "$dst" -type f ! -name REPLICATION_PROVENANCE.json -print0 | sed -z "s#^$dst/##" | sort -z | while IFS= read -r -d '' f; do sha256sum "$dst/$f" | sed "s#  $dst/#  #"; done | sha256sum | awk '{print $1}')"
            test "$source_hash" = "$dest_hash" || { echo "COLLISION_BLOCKED"; exit 31; }
            echo "VERIFIED_EXISTING=true" >> "$GITHUB_ENV"
          else
            mkdir -p "$(dirname "$dst")"
            cp -a "$src" "$dst"
            echo "VERIFIED_EXISTING=false" >> "$GITHUB_ENV"
          fi
          SOURCE_TREE_HASH="$source_hash" python - <<'PY'
          import json, os, pathlib, re
          root=pathlib.Path(os.environ["DEST_PATH"])
          rows=[json.loads(x) for x in (root/"manifests/SOURCE_MANIFEST.jsonl").read_text().splitlines() if x.strip()]
          assert len(rows)==12
          assert len({x["id"] for x in rows})==12
          for row in rows:
              assert re.fullmatch(r"[0-9a-f]{40}",row["source_commit"])
              assert re.fullmatch(r"[0-9a-f]{64}",row["sha256"])
              if row["license"]=="NOASSERTION":
                  assert row["mode"] in {"REFERENCE_ONLY","DOCUMENTATION_ONLY"}
          provenance={
              "source_repository":os.environ["SOURCE_REPO"],
              "source_commit":os.environ["SOURCE_COMMIT"],
              "source_path":os.environ["SOURCE_PATH"],
              "source_tree_sha256":os.environ["SOURCE_TREE_HASH"],
              "destination":os.environ["DEST_PATH"],
              "components":len(rows),
              "gaps":0
          }
          (root/"REPLICATION_PROVENANCE.json").write_text(json.dumps(provenance,indent=2)+"\n")
          PY
          python -m json.tool "$dst/registry/SOURCE_ROUTES.json" >/dev/null
          python -m json.tool "$dst/contracts/recipe.schema.json" >/dev/null
          ruby -e "require 'yaml'; YAML.safe_load(File.read(ARGV[0]), aliases: true)" "$dst/workflow.dag.yaml"

      - name: Single commit and push
        if: env.VERIFIED_EXISTING != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "feat(wordflow-code): replicate verified YAIWES recipe library"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*5))
          done
          exit 1

  read-back:
    needs: replicate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published nct-core main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify published destination
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEST_PATH/REPLICATION_PROVENANCE.json"
          test "$(jq -r .source_commit "$DEST_PATH/REPLICATION_PROVENANCE.json")" = "$SOURCE_COMMIT"
          test "$(jq -r .components "$DEST_PATH/REPLICATION_PROVENANCE.json")" = "12"
          test "$(jq -r .gaps "$DEST_PATH/REPLICATION_PROVENANCE.json")" = "0"
          python -m json.tool "$DEST_PATH/manifests/SOURCE_MANIFEST.jsonl" >/dev/null 2>&1 || python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["DEST_PATH"])/"manifests/SOURCE_MANIFEST.jsonl"
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows)==12
          PY
          echo "READ_BACK=PASS COMPONENTS=12 GAPS=0"
