name: Rename Fromtend code NCT
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rename-fromtend-code-nct
  cancel-in-progress: false
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: git mv DEST
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local lfs.fetchexclude '*'
          git config --local filter.lfs.smudge 'git-lfs smudge --skip -- %f'
          git config --local filter.lfs.process 'git-lfs filter-process --skip'
          DEST_NEW='Frontend code NCT'
          for OLD in 'Fromtend code' 'fromtend code NCT' 'Core/Fromtend code'; do
            if [ -d "$OLD" ] && [ "$OLD" != "$DEST_NEW" ]; then
              if [ ! -d "$DEST_NEW" ]; then
                git mv "$OLD" "$DEST_NEW"
              else
                git mv -k "$OLD"/* "$DEST_NEW"/ || true
                rmdir "$OLD" 2>/dev/null || rm -rf "$OLD"
              fi
            fi
          done
          test -d "$DEST_NEW"
          test -f "$DEST_NEW"/Cline_0001.zip || echo 'WARN Cline zip missing'
          git add -A -- ':!.github'
          git diff --cached --quiet && echo 'NOOP' && exit 0
          git commit -m 'move: DEST -> Frontend code NCT'
          git pull --rebase origin main
          git push --no-verify origin main
