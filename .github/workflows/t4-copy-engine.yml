name: T4 copy engine NCT
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: t4-copy-engine-nct
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: copy engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git clone --depth 1 --filter=blob:none --sparse https://github.com/maxbry123-commits/agentes.git /tmp/agentes
          git -C /tmp/agentes sparse-checkout set code-programming-engine
          mkdir -p code-programming-engine
          if [ -d /tmp/agentes/code-programming-engine ]; then
            cp -a /tmp/agentes/code-programming-engine/. code-programming-engine/
          fi
          git add -A -- ':!.github'
          git diff --cached --quiet && echo NOOP && exit 0
          git commit -m 'copy: code-programming-engine desde agentes'
          git pull --rebase origin main
          git push --no-verify origin main
